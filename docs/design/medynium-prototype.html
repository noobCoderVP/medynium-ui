<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Medynium: clinical workstation prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #edf1f0;
        --panel: #ffffff;
        --panel2: #f6f8f7;
        --ink: #12262b;
        --ink2: #4a5f63;
        --line: #d5dedc;
        --line2: #e5ecea;
        --brand: #0b6e6e;
        --brand-soft: #ddf0ee;
        --brand-ink: #ffffff;
        --agent: #5b4bc4;
        --agent-bg: #f2f0fb;
        --agent-line: #dad5f2;
        --agent-ink: #ffffff;
        --fact: #2f5d9e;
        --fact-bg: #e6eef9;
        --src: #0b6e6e;
        --src-bg: #ddf0ee;
        --syn: #8a5300;
        --syn-bg: #fbefd5;
        --warn: #a8480a;
        --warn-bg: #fdebdc;
        --crit: #b3261e;
        --ok: #1e7a46;
        --ok-bg: #e1f3e8;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1618;
          --panel: #142124;
          --panel2: #101b1d;
          --ink: #e6efee;
          --ink2: #9db2b5;
          --line: #26383b;
          --line2: #1c2c2f;
          --brand: #3fb3a8;
          --brand-soft: #173b3a;
          --brand-ink: #06201f;
          --agent: #a99bff;
          --agent-bg: #17172b;
          --agent-line: #2e2d52;
          --agent-ink: #14123a;
          --fact: #8db6f2;
          --fact-bg: #17263d;
          --src: #5cd0c3;
          --src-bg: #143533;
          --syn: #f0b95b;
          --syn-bg: #3a2c10;
          --warn: #f0a468;
          --warn-bg: #3a2412;
          --crit: #ff8f86;
          --ok: #6bd39a;
          --ok-bg: #12301f;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1618;
        --panel: #142124;
        --panel2: #101b1d;
        --ink: #e6efee;
        --ink2: #9db2b5;
        --line: #26383b;
        --line2: #1c2c2f;
        --brand: #3fb3a8;
        --brand-soft: #173b3a;
        --brand-ink: #06201f;
        --agent: #a99bff;
        --agent-bg: #17172b;
        --agent-line: #2e2d52;
        --agent-ink: #14123a;
        --fact: #8db6f2;
        --fact-bg: #17263d;
        --src: #5cd0c3;
        --src-bg: #143533;
        --syn: #f0b95b;
        --syn-bg: #3a2c10;
        --warn: #f0a468;
        --warn-bg: #3a2412;
        --crit: #ff8f86;
        --ok: #6bd39a;
        --ok-bg: #12301f;
      }
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font:
          400 14px/1.5 "Instrument Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-columns: 212px minmax(0, 1fr) 396px;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        grid-template-areas: "banner banner banner" "top top top" "nav work agent" "strip strip strip";
      }
      .app[data-agent="closed"] {
        grid-template-columns: 212px minmax(0, 1fr) 0;
      }
      .app[data-agent="closed"] aside.agent {
        display: none;
      }

      /* banner and top bar */
      .banner {
        grid-area: banner;
        background: var(--syn-bg);
        color: var(--syn);
        font-size: 12px;
        padding: 4px 14px;
        text-align: center;
        border-bottom: 1px solid var(--line);
      }
      .top {
        grid-area: top;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: Newsreader, Georgia, serif;
        font-weight: 600;
        font-size: 21px;
        letter-spacing: -0.01em;
        white-space: nowrap;
        width: 190px;
        flex: none;
      }
      .brand svg {
        flex: none;
      }
      .search {
        position: relative;
        width: 230px;
        flex: none;
      }
      .search input,
      .cmd input {
        width: 100%;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: var(--panel2);
        outline-offset: 1px;
      }
      .cmd {
        flex: 1;
        min-width: 120px;
        position: relative;
      }
      .cmd input {
        border-color: var(--agent-line);
        background: var(--agent-bg);
        padding-left: 34px;
      }
      .cmd svg {
        position: absolute;
        left: 11px;
        top: 10px;
        color: var(--agent);
      }
      .pop {
        position: absolute;
        top: 40px;
        left: 0;
        right: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        z-index: 30;
        padding: 4px;
        min-width: 240px;
      }
      .pop button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 8px 10px;
        border-radius: 6px;
      }
      .pop button:hover,
      .pop button:focus-visible {
        background: var(--brand-soft);
      }
      .pop small {
        color: var(--ink2);
        display: block;
      }
      .iconbtn,
      .userbtn,
      .topbtn {
        height: 36px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
      }
      .iconbtn {
        width: 36px;
        justify-content: center;
        padding: 0;
      }
      .topbtn[aria-pressed="true"] {
        background: var(--agent-bg);
        border-color: var(--agent-line);
        color: var(--agent);
      }
      .userbtn .av {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--brand);
        color: var(--brand-ink);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 600;
      }
      .userbtn small {
        color: var(--ink2);
        display: block;
        line-height: 1.1;
        font-size: 11px;
      }
      .userbtn span.t {
        text-align: left;
        line-height: 1.15;
      }
      .menu {
        position: absolute;
        right: 0;
        top: 40px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        z-index: 40;
        padding: 6px;
        width: 270px;
      }
      .menu h4 {
        margin: 6px 8px;
        font-size: 12px;
        color: var(--ink2);
        font-weight: 500;
      }
      .menu button {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 8px;
        border-radius: 6px;
      }
      .menu button:hover {
        background: var(--brand-soft);
      }
      .menu .on {
        background: var(--brand-soft);
      }
      .menu hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 6px 0;
      }
      .rel {
        position: relative;
      }

      /* nav */
      .nav {
        grid-area: nav;
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: auto;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 0;
        background: none;
        padding: 9px 10px;
        border-radius: 8px;
        text-align: left;
        color: var(--ink2);
        font-weight: 500;
        position: relative;
      }
      .nav button:hover {
        background: var(--panel2);
      }
      .nav button[aria-current="page"] {
        background: var(--brand-soft);
        color: var(--brand);
        font-weight: 600;
      }
      .nav button[aria-current="page"]::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--brand);
      }
      .who {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding: 12px 8px 4px;
        color: var(--ink2);
        font-size: 12.5px;
      }
      .who b {
        color: var(--ink);
        display: block;
        font-size: 13px;
      }

      /* work area */
      .workwrap {
        grid-area: work;
        position: relative;
        min-height: 0;
        min-width: 0;
      }
      .work {
        position: absolute;
        inset: 0;
        overflow: auto;
        padding: 20px 24px 32px;
      }
      .h1 {
        font-family: Newsreader, Georgia, serif;
        font-weight: 600;
        font-size: 28px;
        line-height: 1.15;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }
      .sub {
        color: var(--ink2);
        margin: 0 0 18px;
        max-width: 70ch;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .grid {
        display: grid;
        gap: 14px;
      }
      .g2 {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
      .g3 {
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        min-width: 0;
      }
      .card h3 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 600;
      }
      .card h3 small {
        font-weight: 400;
        color: var(--ink2);
        margin-left: 6px;
      }
      .muted {
        color: var(--ink2);
      }
      .small {
        font-size: 12.5px;
      }
      .btn {
        height: 34px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 0 12px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn:hover {
        background: var(--panel2);
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--brand-ink);
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      .btn.violet {
        background: var(--agent);
        border-color: var(--agent);
        color: var(--agent-ink);
      }
      .btn.sm {
        height: 28px;
        padding: 0 10px;
        font-size: 13px;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 8px;
        border-radius: 11px;
        font-size: 12px;
        font-weight: 500;
        background: var(--panel2);
        border: 1px solid var(--line);
        white-space: nowrap;
      }
      .chip.lab {
        background: var(--fact-bg);
        border-color: transparent;
        color: var(--fact);
      }
      .chip.ed,
      .chip.warn {
        background: var(--warn-bg);
        border-color: transparent;
        color: var(--warn);
      }
      .chip.med {
        background: var(--syn-bg);
        border-color: transparent;
        color: var(--syn);
      }
      .chip.doc {
        background: var(--agent-bg);
        border-color: transparent;
        color: var(--agent);
      }
      .chip.ok {
        background: var(--ok-bg);
        border-color: transparent;
        color: var(--ok);
      }
      .chip.low {
        background: var(--warn-bg);
        border-color: transparent;
        color: var(--warn);
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th {
        font-weight: 500;
        color: var(--ink2);
        text-align: left;
        font-size: 12.5px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 10px;
        border-bottom: 1px solid var(--line2);
        vertical-align: top;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tbody tr.click {
        cursor: pointer;
      }
      tbody tr.click:hover {
        background: var(--panel2);
      }
      .pname {
        font-weight: 600;
      }
      .id {
        font-size: 12px;
        color: var(--ink2);
      }
      .tablewrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }
      .tablewrap table th:first-child,
      .tablewrap table td:first-child {
        padding-left: 16px;
      }
      .kpi {
        font-family: Newsreader, Georgia, serif;
        font-size: 30px;
        font-weight: 600;
        line-height: 1;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .kpis small {
        display: block;
        color: var(--ink2);
        font-size: 12.5px;
        margin-top: 2px;
      }
      .labrow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line2);
      }
      .labrow:last-child {
        border-bottom: 0;
      }
      .ln {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
        line-height: 1.25;
      }
      .lv {
        font-family: Newsreader, Georgia, serif;
        font-size: 22px;
        font-weight: 600;
        min-width: 44px;
        text-align: right;
      }
      .sp {
        flex: none;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .list li {
        padding: 8px 0;
        border-bottom: 1px solid var(--line2);
      }
      .list li:last-child {
        border-bottom: 0;
      }

      /* patient header and tabs */
      .phead {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .back {
        border: 0;
        background: none;
        color: var(--ink2);
        padding: 0;
        margin-bottom: 6px;
        font-weight: 500;
      }
      .scope {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--agent);
        background: var(--agent-bg);
        border: 1px solid var(--agent-line);
        border-radius: 11px;
        height: 22px;
        padding: 0 9px;
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        margin: 0 0 16px;
        overflow: auto;
      }
      .tabs button {
        border: 0;
        background: none;
        padding: 9px 12px;
        color: var(--ink2);
        font-weight: 500;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
      }
      .tabs button[aria-selected="true"] {
        color: var(--brand);
        border-bottom-color: var(--brand);
        font-weight: 600;
      }
      .pins {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .pin {
        background: var(--agent-bg);
        border: 1px solid var(--agent-line);
        border-radius: 10px;
        padding: 8px 12px;
        max-width: 380px;
        font-size: 13px;
      }
      .pin b {
        display: block;
      }

      /* timeline */
      .tl {
        position: relative;
        margin: 0;
        padding: 0 0 0 22px;
        list-style: none;
      }
      .tl::before {
        content: "";
        position: absolute;
        left: 5px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--line);
      }
      .tl li {
        position: relative;
        padding: 0 0 18px;
      }
      .tl li::before {
        content: "";
        position: absolute;
        left: -22px;
        top: 5px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--ink2);
      }
      .tl li.visit::before {
        border-color: var(--warn);
      }
      .tl li.lab::before {
        border-color: var(--fact);
      }
      .tl li.med::before {
        border-color: var(--syn);
      }
      .tl li.claim::before {
        border-color: var(--brand);
      }
      .tl .when {
        font-size: 12.5px;
        color: var(--ink2);
      }
      .tl .ttl {
        font-weight: 600;
      }
      .tl .rec {
        font-size: 12px;
        color: var(--ink2);
        margin-top: 2px;
      }

      /* statements (the memorable part) */
      .stmt {
        display: grid;
        grid-template-columns: 4px minmax(0, 1fr);
        gap: 12px;
        margin: 10px 0;
      }
      .stmt::before {
        content: "";
        border-radius: 2px;
        background: var(--fact);
      }
      .stmt.source::before {
        background: var(--src);
      }
      .stmt.synth::before {
        background: var(--syn);
      }
      .stag {
        font-size: 12px;
        font-weight: 600;
        color: var(--fact);
        margin-bottom: 1px;
      }
      .stmt.source .stag {
        color: var(--src);
      }
      .stmt.synth .stag {
        color: var(--syn);
      }
      .stext {
        line-height: 1.5;
      }
      .refs {
        display: inline-flex;
        gap: 4px;
        margin-left: 6px;
        vertical-align: baseline;
      }
      .ref {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 5px;
        font-size: 11.5px;
        font-weight: 600;
        padding: 0 5px;
        height: 19px;
        line-height: 17px;
        color: var(--ink2);
      }
      .ref:hover {
        border-color: var(--brand);
        color: var(--brand);
      }
      .ans {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .ans h4 {
        margin: 14px 0 2px;
        font-size: 13.5px;
      }
      .ans .lead {
        font-size: 14.5px;
      }
      .ans-h {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--ink2);
        margin-bottom: 4px;
      }
      .ans-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .checked {
        margin-top: 12px;
        font-size: 13px;
        color: var(--ink2);
        border-top: 1px solid var(--line2);
        padding-top: 10px;
      }
      .checked ul {
        margin: 4px 0 0;
        padding-left: 18px;
      }

      /* agent */
      aside.agent {
        grid-area: agent;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--agent-bg);
        border-left: 1px solid var(--agent-line);
      }
      .ahead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--agent-line);
      }
      .ahead h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--agent);
      }
      .msgs {
        flex: 1;
        overflow: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
      }
      .me {
        align-self: flex-end;
        background: var(--panel);
        border: 1px solid var(--agent-line);
        border-radius: 12px 12px 2px 12px;
        padding: 8px 12px;
        max-width: 88%;
      }
      .bot {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .steps {
        list-style: none;
        margin: 0;
        padding: 0;
        border: 1px solid var(--agent-line);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }
      .steps summary {
        padding: 7px 12px;
        cursor: pointer;
        color: var(--agent);
        font-weight: 600;
        font-size: 12.5px;
      }
      .steps ol {
        margin: 0;
        padding: 0 12px 8px;
        list-style: none;
      }
      .step {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 8px;
        padding: 5px 0;
        font-size: 12.5px;
      }
      .step .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid var(--agent-line);
        margin-top: 3px;
      }
      .step.run .dot {
        border-color: var(--agent);
        border-top-color: transparent;
        animation: spin 0.8s linear infinite;
      }
      .step.done .dot {
        background: var(--ok);
        border-color: var(--ok);
      }
      .step b {
        font-weight: 600;
      }
      .step span {
        color: var(--ink2);
        display: block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .sugg {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .sugg button {
        border: 1px solid var(--agent-line);
        background: var(--panel);
        border-radius: 14px;
        padding: 4px 10px;
        font-size: 12.5px;
        text-align: left;
      }
      .sugg button:hover {
        border-color: var(--agent);
      }
      .composer {
        padding: 10px 12px 12px;
        border-top: 1px solid var(--agent-line);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .composer form {
        display: flex;
        gap: 8px;
      }
      .composer input {
        flex: 1;
        height: 38px;
        border: 1px solid var(--agent-line);
        border-radius: 8px;
        padding: 0 12px;
        background: var(--panel);
      }
      .allow {
        font-size: 12px;
        color: var(--ink2);
      }

      /* drawer */
      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(560px, 100%);
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.12);
        z-index: 20;
        display: flex;
        flex-direction: column;
        animation: slide 0.18s ease-out;
      }
      @keyframes slide {
        from {
          transform: translateX(16px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .drawer[hidden] {
        display: none;
      }
      .dhead {
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }
      .dhead h2 {
        margin: 0;
        font-family: Newsreader, Georgia, serif;
        font-size: 21px;
      }
      .dbody {
        overflow: auto;
        padding: 6px 18px 24px;
      }
      .dbody h3 {
        font-size: 14px;
        margin: 18px 0 8px;
      }
      .ev {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 8px;
        background: var(--panel);
      }
      .ev.hl {
        border-color: var(--agent);
        box-shadow: 0 0 0 3px var(--agent-line);
      }
      .ev .k {
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .ev .k b.rid {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 5px;
        font-size: 11.5px;
        padding: 0 5px;
      }
      .ev .meta {
        font-size: 12px;
        color: var(--ink2);
        margin-top: 2px;
      }
      pre.sql {
        margin: 0;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        overflow: auto;
        font:
          12.5px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        white-space: pre;
      }
      .note {
        background: var(--syn-bg);
        color: var(--syn);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12.5px;
        margin-top: 14px;
      }

      /* strip */
      .strip {
        grid-area: strip;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 6px 14px;
        background: var(--panel);
        border-top: 1px solid var(--line);
        font-size: 12.5px;
        color: var(--ink2);
        min-height: 34px;
      }
      .strip .live {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
        flex: none;
      }
      .strip .last {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .strip button {
        border: 0;
        background: none;
        color: var(--brand);
        font-weight: 600;
        padding: 0;
      }

      /* guide */
      .guide {
        position: fixed;
        right: 16px;
        top: calc(96px + env(safe-area-inset-top, 0px));
        width: 340px;
        max-width: calc(100% - 32px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
        z-index: 60;
        padding: 14px;
      }
      .guide h2 {
        margin: 0 0 4px;
        font-family: Newsreader, Georgia, serif;
        font-size: 19px;
      }
      .guide button.step-btn {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 8px;
        padding: 8px 10px;
        margin-top: 8px;
      }
      .guide button.step-btn:hover {
        border-color: var(--brand);
      }
      .guide button.step-btn small {
        display: block;
        color: var(--ink2);
      }
      .guide[hidden] {
        display: none;
      }
      .empty {
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 22px;
        text-align: center;
        color: var(--ink2);
        background: var(--panel);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 54px;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 8px 14px;
        border-radius: 8px;
        z-index: 80;
        font-size: 13px;
      }

      /* responsive */
      @media (max-width: 1180px) {
        .app {
          grid-template-columns: 64px minmax(0, 1fr) 360px;
        }
        .app[data-agent="closed"] {
          grid-template-columns: 64px minmax(0, 1fr) 0;
        }
        .nav button span.lbl,
        .who {
          display: none;
        }
        .nav button {
          justify-content: center;
        }
        .brand {
          width: auto;
        }
        .brand .wm {
          display: none;
        }
        .search {
          width: 180px;
        }
      }
      @media (max-width: 860px) {
        .app,
        .app[data-agent="closed"] {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto auto minmax(0, 1fr) auto;
          grid-template-areas: "banner" "top" "nav" "work" "strip";
        }
        .nav {
          flex-direction: row;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: 6px;
          overflow: auto;
        }
        .nav button[aria-current="page"]::before {
          display: none;
        }
        .nav button span.lbl {
          display: inline;
        }
        .top {
          flex-wrap: wrap;
        }
        .search {
          width: 100%;
          order: 3;
        }
        .cmd {
          order: 4;
          flex-basis: 100%;
        }
        .userbtn span.t {
          display: none;
        }
        .work {
          padding: 14px 14px 28px;
        }
        .app[data-agent="open"] aside.agent {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          top: 18%;
          z-index: 50;
          border-top: 1px solid var(--agent-line);
          border-radius: 14px 14px 0 0;
          box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.25);
        }
        .drawer {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

              function () {
                switchUser("as", true);
                setAgent(true);
                askAgent("Open Amit Kumar");
              },
            ],
            [
              "5. Honest gap",
              "Doctor opens Neha Iyer; one drug is not indexed.",
              function () {
                switchUser("dr", true);
                setAgent(true);
                askAgent("Open Neha Iyer and run the safety review");
              },
            ],
            [
              "6. Same task by hand",
              "Collapse the agent, open the patient from the worklist, press Run safety review.",
              function () {
                switchUser("dr", true);
                setAgent(false);
                setView("dashboard");
                setTimeout(function () {
                  openPatient("p1", { via: "manual" });
                  manualReview("p1");
                }, 150);
              },
            ],
          ];
          const g = $("#guide");
          g.innerHTML =
            '<h2>Demo guide</h2><p class="small muted" style="margin:0">Scripted paths from the BRD. Agent replies in this prototype are scripted, not live model output.</p>' +
            steps
              .map(function (s, i) {
                return (
                  '<button class="step-btn" type="button" data-i="' +
                  i +
                  '"><b>' +
                  esc(s[0]) +
                  "</b><small>" +
                  esc(s[1]) +
                  "</small></button>"
                );
              })
              .join("") +
            '<div class="row" style="margin-top:10px"><button class="btn sm" type="button" id="gClose">Close</button></div>';
          $$("#guide .step-btn").forEach(function (b) {
            b.onclick = function () {
              g.hidden = true;
              $("#guideBtn").setAttribute("aria-expanded", "false");
              steps[+b.dataset.i][2]();
            };
          });
          $("#gClose").onclick = function () {
            g.hidden = true;
            $("#guideBtn").setAttribute("aria-expanded", "false");
          };
        }
        document.addEventListener("click", function (e) {
          const r = e.target.closest && e.target.closest(".ref");
          if (r && !r.closest(".bot") && r.closest("#work")) {
            const a = r.closest("[data-ans]");
            const id = a ? a.dataset.ans : S.lastAns;
            if (drawer && !drawer.hidden && drawer.contains(r)) {
              hlRef(r.dataset.ref);
            } else if (id) {
              openDrawer(id, r.dataset.ref);
            }
          } else if (r && drawer && drawer.contains(r)) {
            hlRef(r.dataset.ref);
          }
          const w = e.target.closest && e.target.closest("#work [data-why]");
          if (w && !w.closest(".bot")) openDrawer(w.dataset.why);
          const pn = e.target.closest && e.target.closest("[data-pin]");
          if (pn && !pn.closest(".bot")) {
            pin(pn.dataset.pin);
          }
          if (!e.target.closest("#userMenu") && !e.target.closest("#userBtn")) {
            $("#userMenu").hidden = true;
            $("#userBtn").setAttribute("aria-expanded", "false");
          }
          if (!e.target.closest("#searchBox")) $("#searchPop").hidden = true;
        });
        $("#userBtn").onclick = function () {
          const m = $("#userMenu");
          m.hidden = !m.hidden;
          this.setAttribute("aria-expanded", String(!m.hidden));
        };
        $("#agentBtn").onclick = function () {
          setAgent(!S.agentOpen);
        };
        $("#agentClose").onclick = function () {
          setAgent(false);
        };
        $("#guideBtn").onclick = function () {
          const g = $("#guide");
          g.hidden = !g.hidden;
          this.setAttribute("aria-expanded", String(!g.hidden));
        };
        $("#themeBtn").onclick = function () {
          const r = document.documentElement;
          const dark =
            r.dataset.theme === "dark" ||
            (!r.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
          r.dataset.theme = dark ? "light" : "dark";
        };
        $("#agentForm").onsubmit = function (e) {
          e.preventDefault();
          const i = $("#agentInput");
          const v = i.value;
          i.value = "";
          askAgent(v);
        };
        $("#cmdForm").onsubmit = function (e) {
          e.preventDefault();
          const i = $("#cmdInput");
          const v = i.value;
          i.value = "";
          askAgent(v);
        };
        $("#patientSearch").oninput = function () {
          const q = this.value.trim().toLowerCase(),
            pop = $("#searchPop");
          if (!q) {
            pop.hidden = true;
            return;
          }
          const m = ents().filter(function (p) {
            return (p.name + " " + p.id).toLowerCase().indexOf(q) > -1;
          });
          pop.innerHTML = m.length
            ? m
                .map(function (p) {
                  return (
                    '<button type="button" data-k="' +
                    p.key +
                    '">' +
                    esc(p.name) +
                    "<small>" +
                    p.id +
                    ", " +
                    p.age +
                    " " +
                    p.sex.toLowerCase() +
                    "</small></button>"
                  );
                })
                .join("")
            : '<div class="small muted" style="padding:8px 10px">No patient in your list matches "' +
              esc(this.value) +
              '".</div>';
          pop.hidden = false;
          $$("#searchPop button").forEach(function (b) {
            b.onclick = function () {
              pop.hidden = true;
              $("#patientSearch").value = "";
              openPatient(b.dataset.k, { via: "manual" });
            };
          });
        };
        $("#patientSearch").onkeydown = function (e) {
          if (e.key === "Enter") {
            const b = $("#searchPop button");
            if (b) b.click();
          }
          if (e.key === "Escape") $("#searchPop").hidden = true;
        };

        /* ---------- boot ---------- */
        setAgent(S.agentOpen);
        renderGuide();
        resetAgent();
        log("sign_in", { via: "user" });
        renderAll();
      })();
    </script>
  </body>
</html>
